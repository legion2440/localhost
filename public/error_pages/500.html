<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>500 Internal Server Error</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0f172a; color: #f8fafc; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .box { text-align: center; max-width: 500px; padding: 40px; background: #1e293b; border-radius: 12px; border: 1px solid #334155; }
    h1 { font-size: 4rem; margin: 0; color: #dc2626; }
    h2 { margin: 10px 0 20px; font-size: 1.5rem; }
    p { color: #94a3b8; font-size: 0.95rem; line-height: 1.5; }
    a { color: #38bdf8; text-decoration: none; margin-top: 24px; display: inline-block; font-weight: 600; }
  </style>
</head>
<body>
  <div class="box">
    <h1>500</h1>
    <h2>Internal Server Error</h2>
    <p>The server encountered an unexpected condition or CGI process crashed.</p>
    <a href="/">&larr; Return to Home</a>
  </div>
</body>
</html>
