# 01-Edu Localhost reference configuration.
# Comments are accepted as a small convenience extension; the subject does not require them.

server {
    listen 127.0.0.1:8080
    listen 127.0.0.1:8081
    server_name localhost test.local

    client_max_body_size 2m

    error_page 400 /error_pages/400.html
    error_page 403 /error_pages/403.html
    error_page 404 /error_pages/404.html
    error_page 405 /error_pages/405.html
    error_page 413 /error_pages/413.html
    error_page 500 /error_pages/500.html

    location / {
        methods GET POST
        root ./public
        index index.html
        autoindex off
    }

    location /api/echo {
        methods POST
        root ./public
    }

    location /uploads {
        methods GET POST DELETE
        root ./public/uploads
        autoindex on
    }

    location /old-page {
        methods GET
        root ./public
        return 301 /
    }

    location /cgi-bin {
        methods GET POST
        root ./cgi-bin
        cgi_extension .py /usr/bin/python3
        cgi_extension .php ../bonus_cpp/php-cgi-wrapper
    }
}

# A second virtual server deliberately shares 127.0.0.1:8080.
# The Host header selects it; the first server remains the default.
server {
    listen 127.0.0.1:8080
    server_name alt.local
    client_max_body_size 512k

    location / {
        methods GET
        root ./public_alt
        index index.html
        autoindex off
    }
}